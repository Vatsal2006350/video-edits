<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b0c; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; color: #f2efe9; }
      /* slow parallax dot grid: the camera never cuts, it drifts */
      #grid { position: absolute; inset: -200px; opacity: .22;
        background-image: radial-gradient(#f2efe9 1.6px, transparent 1.6px); background-size: 54px 54px; }
      #glow { position: absolute; width: 1400px; height: 1400px; left: -160px; top: 260px; border-radius: 50%;
        background: radial-gradient(circle, rgba(118,185,255,.22), rgba(118,185,255,0) 62%); }
      /* the one element that becomes every state */
      #shape { position: absolute; left: 540px; top: 900px; width: 520px; height: 140px;
        border-radius: 70px; background: #f2efe9; overflow: hidden; box-shadow: 0 40px 120px rgba(0,0,0,.45); }
      #label { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        font-size: 52px; font-weight: 700; letter-spacing: -.02em; color: #0b0b0c; }
      #ring { position: absolute; left: 50%; top: 50%; width: 120px; height: 120px; margin: -60px 0 0 -60px;
        border-radius: 50%; border: 12px solid rgba(11,11,12,.15); border-top-color: #0b0b0c; opacity: 0; }
      .bar { position: absolute; bottom: 70px; width: 70px; height: 0; border-radius: 14px; background: #0b0b0c; }
      .line { position: absolute; left: 60px; height: 26px; border-radius: 13px; background: rgba(11,11,12,.14); width: 0; }
      #word { position: absolute; left: 0; right: 0; top: 1360px; text-align: center; font-family: Georgia, "Times New Roman", serif;
        font-style: italic; font-size: 84px; letter-spacing: -.01em; }
      #word span { display: inline-block; }
      #kicker { position: absolute; left: 0; right: 0; top: 430px; text-align: center; font-size: 30px; letter-spacing: .32em;
        text-transform: uppercase; color: rgba(242,239,233,.55); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1080" data-height="1920">
      <div id="grid" class="clip" data-start="0" data-duration="12" data-track-index="0"></div>
      <div id="glow" class="clip" data-start="0" data-duration="12" data-track-index="1"></div>
      <div id="kicker" class="clip" data-start="0" data-duration="12" data-track-index="2">one shape · no cuts</div>
      <div id="shape" class="clip" data-start="0" data-duration="12" data-track-index="3">
        <div id="label">Make a reel</div>
        <div id="ring"></div>
        <div class="line" id="l1" style="top:90px"></div>
        <div class="line" id="l2" style="top:146px"></div>
        <div class="line" id="l3" style="top:202px"></div>
        <div class="bar" id="b1" style="left:80px"></div>
        <div class="bar" id="b2" style="left:180px"></div>
        <div class="bar" id="b3" style="left:280px"></div>
        <div class="bar" id="b4" style="left:380px"></div>
      </div>
      <div id="word" class="clip" data-start="0" data-duration="12" data-track-index="4"><span>tap.</span></div>
    </div>
    <script>
      // Every state is the same element changing size, radius and colour. Nothing is cut.
      // One easing family (expo/power4) keeps the motion feeling like one camera move.
      gsap.set("#shape", { xPercent: -50, yPercent: -50 });
      const tl = gsap.timeline({ paused: true, defaults: { ease: "expo.inOut" } });
      const word = document.querySelector("#word span");
      const say = (t, text) => {
        tl.to(word, { y: -40, opacity: 0, duration: 0.35, ease: "power3.in" }, t)
          .call(() => { word.textContent = text; }, null, t + 0.36)
          .fromTo(word, { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power4.out", immediateRender: false }, t + 0.37);
      };
      tl.to("#grid", { x: -160, y: -260, duration: 12, ease: "none" }, 0)
        .to("#glow", { x: 240, y: -160, scale: 1.2, duration: 12, ease: "sine.inOut" }, 0)
        .fromTo("#shape", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.9, ease: "power4.out" }, 0.1)
        .fromTo(word, { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power4.out" }, 0.4)
        // 1 button press
        .to("#shape", { scale: 0.94, duration: 0.18, ease: "power2.in" }, 1.6)
        .to("#shape", { scale: 1, duration: 0.4, ease: "back.out(3)" }, 1.78)
        // 2 button -> loader circle
        .to("#label", { opacity: 0, duration: 0.25 }, 2.1)
        .to("#shape", { width: 240, height: 240, borderRadius: 120, duration: 0.9 }, 2.1)
        .to("#ring", { opacity: 1, duration: 0.3 }, 2.7)
        .to("#ring", { rotation: 720, duration: 1.6, ease: "power1.inOut" }, 2.6)
        // 3 loader -> card with text lines
        .to("#ring", { opacity: 0, scale: 0.6, duration: 0.3 }, 4.1)
        .to("#shape", { width: 760, height: 320, borderRadius: 44, duration: 1.0 }, 4.15)
        .to("#l1", { width: 520, duration: 0.6, ease: "power3.out" }, 4.8)
        .to("#l2", { width: 610, duration: 0.6, ease: "power3.out" }, 4.92)
        .to("#l3", { width: 380, duration: 0.6, ease: "power3.out" }, 5.04)
        // 4 card -> chart: lines fold away, bars rise on a stagger
        .to(".line", { width: 0, duration: 0.45, ease: "power3.in", stagger: 0.05 }, 6.2)
        .to("#shape", { width: 540, height: 640, borderRadius: 56, duration: 1.0 }, 6.4)
        .to("#b1", { height: 180, duration: 0.7, ease: "power4.out" }, 7.1)
        .to("#b2", { height: 300, duration: 0.7, ease: "power4.out" }, 7.2)
        .to("#b3", { height: 240, duration: 0.7, ease: "power4.out" }, 7.3)
        .to("#b4", { height: 440, duration: 0.7, ease: "power4.out" }, 7.4)
        // 5 chart -> pill again, colour swap, ends where it started (loopable)
        .to(".bar", { height: 0, duration: 0.45, ease: "power3.in", stagger: 0.04 }, 8.9)
        .to("#shape", { width: 520, height: 140, borderRadius: 70, backgroundColor: "#76b9ff", duration: 1.1 }, 9.2)
        .to("#label", { opacity: 1, color: "#0b0b0c", duration: 0.4 }, 10.0)
        .call(() => { document.querySelector("#label").textContent = "Made by code"; }, null, 9.9)
        .to("#shape", { y: -30, duration: 1.4, ease: "sine.inOut" }, 10.4);
      say(2.0, "load.");
      say(4.1, "write.");
      say(6.3, "measure.");
      say(9.1, "ship.");
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
